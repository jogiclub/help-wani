# 파일 위치: server/nginx/stream.conf
# 역할: 고객 런처 TLS 터널(5501)을 종료하고 로컬 uvncrepeater 서버 포트(5500)로 전달
# 주의: 이 파일은 nginx.conf 최상위(http 블록 밖)에서 include 되어야 한다.
#       Debian/Ubuntu 기본 nginx.conf 에는 stream include 가 없으므로 install.sh 가 추가한다.

stream {
    log_format relay_stream '$remote_addr $time_iso8601 proto=$protocol status=$status '
                            'up=$upstream_addr sent=$bytes_sent recv=$bytes_received '
                            'dur=$session_time';

    access_log /var/log/remotehelp/stream-access.log relay_stream;
    error_log  /var/log/remotehelp/stream-error.log warn;

    # 런처 → 리피터 (서버측)
    server {
        listen 5501 ssl;
        listen [::]:5501 ssl;

        ssl_certificate     ${RELAY_SSL_CERT};
        ssl_certificate_key ${RELAY_SSL_KEY};
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:RELAYSSL:10m;
        ssl_session_timeout 10m;

        # 런처는 최초 연결 후 바로 RFB 핸드셰이크를 시작하므로 넉넉히 잡는다.
        proxy_timeout   1h;
        proxy_connect_timeout 10s;

        proxy_pass 127.0.0.1:5500;
    }
}
