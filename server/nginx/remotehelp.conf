# 파일 위치: server/nginx/remotehelp.conf
# 역할: 중계 서버 TLS 종료 후 Node 중계 서버(/agent, /viewer)로 웹소켓 프록시
#
# 토큰 검증은 Node 중계 서버가 포털 API 를 직접 호출해 수행한다(docs/protocol.md 2장).

upstream remotehelp_relay {
    server ${RELAY_UPSTREAM};
    keepalive 32;
}

server {
    listen ${RELAY_HTTPS_PORT} ssl;
    listen [::]:${RELAY_HTTPS_PORT} ssl;
    # nginx 1.25 이상에서는 아래 주석을 해제해 HTTP/2 를 켤 수 있다.
    # http2 on;

    server_name ${RELAY_SERVER_NAME};

    ssl_certificate     ${RELAY_SSL_CERT};
    ssl_certificate_key ${RELAY_SSL_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:RELAYSSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/remotehelp/ws-access.log;
    error_log  /var/log/remotehelp/ws-error.log warn;

    # 화면 프레임이 크므로 본문 제한을 넉넉히 둔다.
    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://remotehelp_relay/healthz;
        access_log off;
    }

    # 고객 PC 에이전트
    location = /agent {
        proxy_pass http://remotehelp_relay;
        include /etc/nginx/remotehelp-ws.inc;
    }

    # 상담원 뷰어
    location = /viewer {
        proxy_pass http://remotehelp_relay;
        include /etc/nginx/remotehelp-ws.inc;
    }

    location / {
        return 404;
    }
}
