# 파일 위치: server/nginx/remotehelp.conf
# 역할: 상담원 noVNC 웹소켓(/ws)을 websockify 로 프록시하고, 접속 전 포털 API 로 1회용 토큰을 검증

# 포털 업스트림.
# proxy_pass 의 URI 에 변수($arg_token)를 쓰면 nginx 가 호스트를 런타임에 해석하려 하므로
# resolver 가 필요해진다. upstream 이름을 쓰면 기동 시 한 번만 해석하므로 resolver 가 필요 없다.
# auth_request 서브요청은 원 요청의 쿼리 인자를 물려받지 않으므로($arg_token 이 비게 된다)
# 원본 요청 URI 에서 토큰을 직접 추출해 변수에 담는다.
map $request_uri $relay_token {
    default "";
    "~[?&]token=(?<captured_token>[a-fA-F0-9]{64})" $captured_token;
}

upstream remotehelp_portal {
    server ${PORTAL_UPSTREAM};
    keepalive 8;
}

server {
    listen ${RELAY_HTTPS_PORT} ssl;
    listen [::]:${RELAY_HTTPS_PORT} ssl;
    # nginx 1.25 이상에서는 아래 주석을 해제해 HTTP/2 를 켤 수 있다.
    # http2 on;

    server_name ${RELAY_SERVER_NAME};

    ssl_certificate     ${RELAY_SSL_CERT};
    ssl_certificate_key ${RELAY_SSL_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/remotehelp/ws-access.log;
    error_log  /var/log/remotehelp/ws-error.log warn;

    # 상태 점검용
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 상담원 뷰어 웹소켓
    location /ws {
        auth_request /_relay_auth;

        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering off;
    }

    # 포털 API 로 1회용 토큰 검증 (200 이면 통과, 그 외 403)
    location = /_relay_auth {
        internal;
        proxy_pass http://remotehelp_portal/api/relay/auth?token=$relay_token&ip=$remote_addr;
        proxy_set_header Host ${PORTAL_HOST};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Relay-Secret "${RELAY_AUTH_SHARED_SECRET}";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
