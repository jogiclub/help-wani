;파일 위치: server/repeater/uvncrepeater.remotehelp.ini
;역할: RemoteHelp 용 uvncrepeater 설정 (Mode 2 전용, 로컬 바인딩)
;설치 위치: /etc/uvncrepeater-ac.ini

[general]
;뷰어측(websockify 전용) / 서버측(nginx stream 전용) 포트
viewerport = 5900
serverport = 5500

;두 포트 모두 루프백에만 바인딩한다. 외부 노출은 nginx 가 담당한다.
ownipaddress = 127.0.0.1

maxsessions = 100
runasuser = uvncrep

;Mode 2(ID 매칭)만 허용한다. Mode 1(직접 주소 지정)은 차단.
allowedmodes = 2

;운영 기본값 1, 장애 분석 시 3
logginglevel = 1

[mode1]
allowedmode1serverport = 0
requirelistedserver = 1
srvListAllow0 = 255.255.255.255
srvListDeny0 = 0.0.0.0

[mode2]
;ID 는 포털이 세션마다 난수로 발급하므로 사전 목록 검사는 사용하지 않는다.
requirelistedid = 0

[eventinterface]
useeventinterface = no
eventlistenerhost = 127.0.0.1
eventlistenerport = 2002
usehttp = true
