{#-
  파일 위치: backend/app/templates/auth/login.html
  역할: 상담원 로그인 화면
-#}
<section class="card rh-auth-card">
  <div class="card-body vstack gap-6">
    <h1 class="rh-auth-title">상담원 로그인</h1>

    <form id="loginForm" class="vstack gap-5">
      <div>
        <label class="form-label" for="email">이메일</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div>
        <label class="form-label" for="password">비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-solid theme-primary btn-lg w-100">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>로그인
      </button>
    </form>

    <div class="text-center fs-sm">
      <a href="{{ base_url('signup') }}">조직 가입 신청</a>
    </div>
  </div>
</section>

<script>
$(function () {
    $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        apiPost({{ base_url('login')|js }}, {
            email: $('#email').val(),
            password: $('#password').val()
        }, function (data) {
            window.location.href = data.redirect;
        });
    });
});
</script>
