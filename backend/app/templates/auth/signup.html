{#-
  파일 위치: backend/app/templates/auth/signup.html
  역할: 조직 가입 신청 화면
-#}
<section class="card rh-auth-card rh-auth-card-wide">
  <div class="card-body vstack gap-6">
    <div>
      <h1 class="rh-auth-title text-start">조직 가입 신청</h1>
      <p class="fs-sm fg-3 mb-0 mt-1">신청 후 운영자 승인이 완료되면 로그인할 수 있습니다.</p>
    </div>

    <form id="signupForm" class="row g-5">
      <div class="col-12 md:col-6">
        <label class="form-label" for="org_name">조직명</label>
        <input type="text" class="form-control" id="org_name" required>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="org_code">조직 주소(영문/숫자)</label>
        <div class="input-group">
          <span class="input-group-text fs-sm">{{ base_url() }}</span>
          <input type="text" class="form-control" id="org_code" required>
        </div>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="biz_no">사업자등록번호</label>
        <input type="text" class="form-control" id="biz_no" required>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="phone">대표 전화</label>
        <input type="text" class="form-control" id="phone">
      </div>

      <div class="col-12 md:col-6">
        <label class="form-label" for="country">국가</label>
        <select class="form-control" id="country">
          {% for code, info in countries.items() %}
            <option value="{{ code }}"
                    data-locale="{{ info.locale }}"
                    data-timezone="{{ info.timezone }}"
                    {{ 'selected' if code == 'KR' else '' }}>{{ info.name }}</option>
          {% endfor %}
        </select>
        <div class="form-text">국가를 고르면 언어와 시간대가 자동으로 맞춰집니다.</div>
      </div>

      <div class="col-12 md:col-6">
        <label class="form-label" for="locale">화면 언어</label>
        <select class="form-control" id="locale">
          {% for code, info in locales.items() %}
            <option value="{{ code }}" {{ 'selected' if code == 'ko' else '' }}>{{ info.name }}</option>
          {% endfor %}
        </select>
        <div class="form-text">고객 접속 페이지와 상담원 화면에 쓰입니다.</div>
      </div>

      <div class="col-12">
        <label class="form-label" for="timezone">시간대</label>
        <select class="form-control" id="timezone">
          {% for tz, label in timezones.items() %}
            <option value="{{ tz }}" {{ 'selected' if tz == 'Asia/Seoul' else '' }}>{{ label }}</option>
          {% endfor %}
        </select>
        <div class="form-text">
          원격 이력과 상담 기록의 시각이 이 시간대로 표시됩니다.
          현재 시각: <span id="tzPreview" class="fw-medium fg-1"></span>
        </div>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="name">담당자명</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="email">담당자 이메일</label>
        <input type="email" class="form-control" id="email" autocomplete="username" required>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="password">비밀번호(10자 이상)</label>
        <input type="password" class="form-control" id="password" autocomplete="new-password" required>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="password_confirm">비밀번호 확인</label>
        <input type="password" class="form-control" id="password_confirm" autocomplete="new-password" required>
      </div>

      <div class="col-12 d-flex flex-wrap align-items-center gap-3">
        <button type="submit" class="btn-solid theme-primary">
          <i class="bi bi-send" aria-hidden="true"></i>가입 신청
        </button>
        <a href="{{ base_url('login') }}" class="btn-text theme-secondary">로그인으로</a>
      </div>
    </form>
  </div>
</section>

<script>
$(function () {
    /**
     * 선택한 시간대의 현재 시각을 미리 보여준다.
     */
    function updateTimezonePreview() {
        var tz = $('#timezone').val();
        var intl = $('#locale').val() === 'ja' ? 'ja-JP'
                 : ($('#locale').val() === 'en' ? 'en-US' : 'ko-KR');

        try {
            $('#tzPreview').text(new Intl.DateTimeFormat(intl, {
                timeZone: tz, dateStyle: 'medium', timeStyle: 'short'
            }).format(new Date()));
        } catch (e) {
            $('#tzPreview').text('-');
        }
    }

    // 국가를 바꾸면 언어와 시간대 기본값을 따라 바꾼다.
    $('#country').on('change', function () {
        var opt = $(this).find('option:selected');
        $('#locale').val(opt.data('locale'));
        $('#timezone').val(opt.data('timezone'));
        updateTimezonePreview();
    });

    $('#locale, #timezone').on('change', updateTimezonePreview);
    updateTimezonePreview();
    setInterval(updateTimezonePreview, 30000);

    $('#signupForm').on('submit', function (e) {
        e.preventDefault();
        apiPost({{ base_url('signup')|js }}, {
            org_name: $('#org_name').val(),
            org_code: $('#org_code').val(),
            biz_no: $('#biz_no').val(),
            phone: $('#phone').val(),
            country: $('#country').val(),
            locale: $('#locale').val(),
            timezone: $('#timezone').val(),
            name: $('#name').val(),
            email: $('#email').val(),
            password: $('#password').val(),
            password_confirm: $('#password_confirm').val()
        }, function (data, message) {
            showToast(message, 'success');
            setTimeout(function () { window.location.href = data.redirect; }, 1500);
        });
    });
});
</script>
