{#-
  파일 위치: backend/app/templates/admin/agents.html
  역할: 상담원 목록(wgrid)과 추가/수정

  Bootstrap 6 + 왔니. 상담원 추가/수정은 오른쪽 드로어(왔니 Offcanvas), 사용/중지 확인은 showConfirmModal 다이얼로그.
-#}
<div class="rh-page-header">
  <div>
    <nav aria-label="현재 위치">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><span class="breadcrumb-link">SETTING</span></li>
        <li class="breadcrumb-divider"></li>
        <li class="breadcrumb-item" aria-current="page"><span class="breadcrumb-link active">상담원 관리</span></li>
      </ol>
    </nav>
    <h1 class="page-title">상담원 관리</h1>
  </div>
</div>

<section class="card overflow-hidden">
  <div class="card-header">
    <h2 class="card-title">상담원 목록</h2>
    <div class="card-actions">
      <button type="button" class="btn-solid theme-primary btn-sm" id="btnAdd">
        <i class="bi bi-plus-lg" aria-hidden="true"></i><span class="btn-label">상담원 추가</span>
      </button>
    </div>
  </div>
  <div id="agentGrid" style="height: calc(100dvh - 290px); min-height: 380px;"></div>
</section>

<!-- 상담원 추가/수정 드로어 (상담원 추가 버튼, 행의 수정 버튼으로 열림) -->
<dialog class="drawer drawer-end rh-drawer" id="agentDrawer" tabindex="-1" aria-labelledby="agentModalTitle">
  <div class="drawer-header">
    <h2 class="drawer-title" id="agentModalTitle">상담원 추가</h2>
    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="닫기"></button>
  </div>

  <div class="drawer-body">
    <input type="hidden" id="agentId">
    <div class="row g-5">
      <div class="col-12 md:col-6">
        <label class="form-label" for="agentName">이름</label>
        <input class="form-control" id="agentName">
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="agentRole">권한</label>
        <select class="form-control" id="agentRole">
          <option value="agent">상담원</option>
          <option value="admin">관리자</option>
        </select>
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="agentEmail">이메일</label>
        <input class="form-control" id="agentEmail">
      </div>
      <div class="col-12 md:col-6">
        <label class="form-label" for="agentPhone">전화</label>
        <input class="form-control" id="agentPhone">
      </div>
      <div class="col-12">
        <label class="form-label" for="agentPassword">비밀번호(10자 이상, 수정 시 비워두면 유지)</label>
        <input type="password" class="form-control" id="agentPassword" autocomplete="new-password">
      </div>
    </div>
  </div>

  <div class="drawer-footer">
    <button type="button" class="btn-outline theme-secondary" data-bs-dismiss="drawer">
      <i class="bi bi-x-lg" aria-hidden="true"></i>취소
    </button>
    <button type="button" class="btn-solid theme-primary" id="btnSaveAgent">
      <i class="bi bi-check-lg" aria-hidden="true"></i>저장
    </button>
  </div>
</dialog>

<script>
var AGENT_ROWS = {{ rows|js }};
var AGENT_URLS = {
    save:   {{ base_url('admin/api/agent_save')|js }},
    toggle: {{ base_url('admin/api/agent_toggle')|js }}
};
</script>
<script src="{{ asset_url('assets/js/admin/agents.js') }}"></script>
