{#-
  파일 위치: backend/app/templates/layouts/_partials.html
  역할: 모든 레이아웃이 공유하는 토스트 영역과 확인 모달

  ui_kit 은 레이아웃이 정한 값(_head.html 과 같음). Bootstrap 화면은 네이티브 <dialog class="dialog"> 를 쓴다.
-#}
{%- set ui_kit = ui_kit|default('tailwind') -%}
{% if ui_kit == 'plain' %}
<!-- 토스트 (고객 화면, customer.css). 확인 다이얼로그는 고객 화면에서 쓰지 않으므로 두지 않는다(없으면 브라우저 confirm). -->
<div id="toastContainer" class="rhc-toasts" aria-live="polite"></div>
{% elif ui_kit == 'bootstrap' %}
<!-- 토스트 (common.js 의 showToast 가 .toast 를 만들어 넣는다) -->
<div id="toastContainer" class="rh-toasts" aria-live="polite" aria-atomic="false"></div>

<!-- 확인 다이얼로그 (common.js 의 showConfirmModal) -->
<dialog class="dialog dialog-sm" id="confirmModal" aria-labelledby="confirmModalTitle">
  <div class="dialog-header">
    <h2 class="dialog-title" id="confirmModalTitle"></h2>
  </div>
  <div class="dialog-body fg-2" id="confirmModalBody"></div>
  <div class="dialog-footer">
    <button type="button" class="btn-outline theme-secondary" id="confirmModalCancel">
      <i class="bi bi-x-lg" aria-hidden="true"></i>취소
    </button>
    <button type="button" class="btn-solid theme-primary" id="confirmModalOk">
      <i class="bi bi-check-lg" aria-hidden="true"></i>확인
    </button>
  </div>
</dialog>
{% else %}
<!-- 토스트 -->
<div id="toastContainer"
     class="pointer-events-none fixed top-4 right-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2"></div>

<!-- 확인 모달 -->
<div id="confirmModal" data-modal-backdrop
     class="modal-root fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
  <div class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <div class="px-5 py-4 text-base font-semibold text-slate-800" id="confirmModalTitle"></div>
    <div class="px-5 pb-5 text-sm text-slate-600" id="confirmModalBody"></div>
    <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
      <button type="button" class="btn btn-secondary" id="confirmModalCancel">취소</button>
      <button type="button" class="btn btn-primary" id="confirmModalOk">확인</button>
    </div>
  </div>
</div>
{% endif %}
