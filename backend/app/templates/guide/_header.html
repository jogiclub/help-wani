{#-
  파일 위치: backend/app/templates/guide/_header.html
  역할: 공개 가이드 화면 상단 (조직 로고, 이름, 안내 문구)
-#}
<div class="gt-panel">
  <div class="gt-panel-body gt-header">
    {% if not empty(org.logo_path) %}
      <img src="{{ base_url(org.logo_path) }}" alt="{{ org.name }}" class="gt-header-logo">
    {% else %}
      <div class="gt-header-initial">
        {{ org.name[:1] }}
      </div>
    {% endif %}
    <div class="gt-header-text">
      <a class="gt-header-title" href="{{ base_url(org.org_code ~ '/guide') }}">
        {{ lang_text('guide.page_title', {'org': org.name}) }}
      </a>
      <p class="gt-header-desc">{{ lang_text('guide.subtitle') }}</p>
    </div>
  </div>
</div>
