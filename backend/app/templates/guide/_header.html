{#-
  파일 위치: backend/app/templates/guide/_header.html
  역할: 공개 가이드 화면 상단 (조직 로고, 이름, 안내 문구)
-#}
<div class="card">
  <div class="card-body flex items-center gap-4">
    {% if not empty(org.logo_path) %}
      <img src="{{ base_url(org.logo_path) }}" alt="{{ org.name }}" class="max-h-12 max-w-32 shrink-0">
    {% else %}
      <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-brand-600 text-xl font-bold text-white">
        {{ org.name[:1] }}
      </div>
    {% endif %}
    <div class="min-w-0">
      <a class="text-lg font-bold text-slate-800 hover:underline" href="{{ base_url(org.org_code ~ '/guide') }}">
        {{ lang_text('guide.page_title', {'org': org.name}) }}
      </a>
      <p class="text-sm text-slate-500">{{ lang_text('guide.subtitle') }}</p>
    </div>
  </div>
</div>
