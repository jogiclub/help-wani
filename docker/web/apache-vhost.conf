# 파일 위치: docker/web/apache-vhost.conf
# 역할: 포털 가상호스트 (CI3 URL 재작성)
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # CI3 내부 디렉터리 직접 접근 차단
    <DirectoryMatch "^/var/www/html/(application|system)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
