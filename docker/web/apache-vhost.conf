# 파일 위치: docker/web/apache-vhost.conf
# 역할: 포털 앞단 가상호스트 — 정적 파일(/assets), 고객 실제 IP 복원, http->https 전환,
#       상담원 뷰어/상담 실시간 웹소켓 경유, 나머지 요청을 FastAPI(api)로 넘기기
<VirtualHost *:80>
    # backend/assets 만 /var/www/html/assets 로 붙인다(docker-compose.yml). 그 밖의 주소는 모두 FastAPI 로 간다.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # assets/uploads/.htaccess(스크립트 실행 차단, nosniff)를 읽는다.
        AllowOverride All
        Require all granted

        # 설정·기록·문서 파일은 내주지 않는다(assets/downloads/README.md 등).
        <FilesMatch "\.(ini|log|sql|md)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Cloudflare Tunnel(cloudflared)에서 온 요청만 CF-Connecting-IP 를 고객 IP 로 쓴다.
    # 주소는 docker-compose.yml 의 cloudflared ipv4_address 와 같아야 한다. 다른 곳에서 온 요청의 헤더는 무시된다.
    # 대역(/29)으로 넓히면 안 된다. 8099 직접 요청이 tunnel 망 게이트웨이(10.250.88.1)로 들어올 수 있다.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 10.250.88.5

    # Cloudflare 로 http 접속하면 https 로 보낸다. 영역 전체 설정(Always Use HTTPS)은 wani.im 의
    # 다른 사이트에도 걸리므로 이 호스트만 여기서 처리한다. 8099 직접 접속(X-Forwarded-Proto 없음)은 그대로 둔다.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^help\.wani\.im$ [NC]
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://help.wani.im%{REQUEST_URI} [R=301,L]

    # 상담 실시간 메시지 웹소켓. https 로 접속한 화면은 다른 포트(8091)로 붙을 수 없으므로 포털 주소로 받는다.
    ProxyPass "/realtime-ws" "ws://realtime-msg:8091/ws"

    # 상담원 뷰어 웹소켓을 포털 주소로 받아 relay 로 넘긴다(시험 서버용).
    # 브라우저는 relay 의 자체 서명 인증서를 믿지 않으므로 ws://<포털>/relay-viewer 로 붙고,
    # 컨테이너 내부 구간은 relay 인증서를 신뢰 CA 로 지정해 검증한 wss 로 간다(SAN 에 DNS:relay 포함).
    # 운영은 공인 인증서를 쓰고 RELAY_VIEWER_WS_URL 을 wss://<도메인>/viewer 로 둔다.
    # 인증서는 relay 가 기동하며 relay-ca 볼륨에 넣는다. 처음 설치 때 없으면 web 을 한 번 재시작한다.
    <IfFile "/etc/remotehelp/relay-ca/relay.crt">
        SSLProxyEngine On
        SSLProxyVerify require
        SSLProxyCACertificateFile /etc/remotehelp/relay-ca/relay.crt
        ProxyPass "/relay-viewer" "wss://relay:8443/viewer"
    </IfFile>

    # ---- FastAPI 포털로 넘기기
    # 고객 IP: mod_remoteip 가 CF-Connecting-IP 로 바꾼 주소(REMOTE_ADDR)를 넘긴다.
    # set 은 고객이 같은 이름의 머리글을 보내도 덮어쓴다. FastAPI 는 web 고정 주소에서 온 이 머리글만 믿는다(backend/app/core/request.py).
    RequestHeader set X-RemoteHelp-Client-IP "expr=%{REMOTE_ADDR}"
    # Host 를 그대로 넘겨 FastAPI 가 접속한 주소로 base_url 을 만든다(help.wani.im, localhost:8099 ...).
    ProxyPreserveHost On
    # X-Forwarded-For/Host/Server 는 넣지 않는다(FastAPI 는 쓰지 않음, CLAUDE.md 3.12). X-Forwarded-Proto 는 cloudflared 가 보낸 값이 그대로 간다.
    ProxyAddHeaders Off
    # 외부 이미지 저장(가이드)은 한 장에 15초까지 걸려 오래 걸릴 수 있다.
    ProxyTimeout 600

    # ProxyPass 는 적힌 순서대로 처음 맞는 규칙을 쓴다(mod_proxy 문서). 제외(!)를 FastAPI 규칙보다 먼저 둔다.
    ProxyPass "/assets/" "!"
    ProxyPass "/assets" "!"
    ProxyPass "/realtime-ws" "!"
    ProxyPass "/relay-viewer" "!"
    # api 의 tunnel 망 고정 주소(docker-compose.yml). 이 망에서 보내야 FastAPI 가 web 주소(10.250.88.2)로 본다.
    ProxyPass "/" "http://10.250.88.3:8000/"
    ProxyPassReverse "/" "http://10.250.88.3:8000/"

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
