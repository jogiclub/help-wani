# 파일 위치: docker/web/apache-vhost.conf
# 역할: 포털 가상호스트 (CI3 URL 재작성, 고객 실제 IP 복원, 상담원 뷰어/상담 실시간 웹소켓 포털 경유, 포털 처리 서버 선택)
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # CI3 내부 디렉터리 직접 접근 차단
    <DirectoryMatch "^/var/www/html/(application|system)/">
        Require all denied
    </DirectoryMatch>

    # Cloudflare Tunnel(cloudflared)에서 온 요청만 CF-Connecting-IP 를 고객 IP 로 쓴다.
    # 주소는 docker-compose.yml 의 cloudflared ipv4_address 와 같아야 한다. 다른 곳에서 온 요청의 헤더는 무시된다.
    # 대역(/29)으로 넓히면 안 된다. 8099 직접 요청이 tunnel 망 게이트웨이(10.250.88.1)로 들어올 수 있다.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 10.250.88.5

    # Cloudflare 로 http 접속하면 https 로 보낸다. 영역 전체 설정(Always Use HTTPS)은 wani.im 의
    # 다른 사이트에도 걸리므로 이 호스트만 여기서 처리한다. 8099 직접 접속(X-Forwarded-Proto 없음)은 그대로 둔다.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^help\.wani\.im$ [NC]
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://help.wani.im%{REQUEST_URI} [R=301,L]

    # 상담 실시간 메시지 웹소켓. https 로 접속한 화면은 다른 포트(8091)로 붙을 수 없으므로 포털 주소로 받는다.
    ProxyPass "/realtime-ws" "ws://realtime-msg:8091/ws"

    # 상담원 뷰어 웹소켓을 포털 주소로 받아 relay 로 넘긴다(시험 서버용).
    # 브라우저는 relay 의 자체 서명 인증서를 믿지 않으므로 ws://<포털>/relay-viewer 로 붙고,
    # 컨테이너 내부 구간은 relay 인증서를 신뢰 CA 로 지정해 검증한 wss 로 간다(SAN 에 DNS:relay 포함).
    # 운영은 공인 인증서를 쓰고 RELAY_VIEWER_WS_URL 을 wss://<도메인>/viewer 로 둔다.
    # 인증서는 relay 가 기동하며 relay-ca 볼륨에 넣는다. 처음 설치 때 없으면 web 을 한 번 재시작한다.
    <IfFile "/etc/remotehelp/relay-ca/relay.crt">
        SSLProxyEngine On
        SSLProxyVerify require
        SSLProxyCACertificateFile /etc/remotehelp/relay-ca/relay.crt
        ProxyPass "/relay-viewer" "wss://relay:8443/viewer"
    </IfFile>

    # 포털을 처리할 서버: 환경변수 PORTAL_BACKEND = php | fastapi (docker-compose.yml 기본 php).
    # fastapi 면 /assets 와 위 웹소켓 경로를 뺀 나머지를 FastAPI(api)로 넘긴다. 위의 ProxyPass 보다 뒤에 둬야 웹소켓 규칙이 먼저 맞는다.
    Include /etc/apache2/remotehelp/backend-${PORTAL_BACKEND}.conf

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
