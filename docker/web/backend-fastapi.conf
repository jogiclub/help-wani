# 파일 위치: docker/web/backend-fastapi.conf
# 역할: 포털 요청을 FastAPI(api)로 넘기는 설정. PORTAL_BACKEND=fastapi 일 때 apache-vhost.conf 가 읽는다(docs/fastapi-migration-plan.md 9단계).
#
# Apache 는 그대로 앞에 서서 TLS 없는 http 를 받고, 고객 IP 복원(mod_remoteip), http->https 전환,
# 상담 실시간·원격 뷰어 웹소켓 경유(/realtime-ws, /relay-viewer), 정적 파일(/assets)을 계속 맡는다.
# 나머지 주소만 FastAPI 로 넘긴다. ProxyPass 는 적힌 순서대로 처음 맞는 규칙을 쓰므로 제외(!)를 먼저 둔다.

# 고객 IP: mod_remoteip 가 cloudflared 의 CF-Connecting-IP 로 바꾼 주소(REMOTE_ADDR)를 넘긴다.
# set 은 고객이 같은 이름의 머리글을 보내도 덮어쓴다. FastAPI 는 web 고정 주소에서 온 이 머리글만 믿는다(core/request.py).
RequestHeader set X-RemoteHelp-Client-IP "expr=%{REMOTE_ADDR}"

# Host 를 그대로 넘겨 FastAPI 가 접속한 주소로 base_url 을 만든다(help.wani.im, localhost:8099 ...).
ProxyPreserveHost On
# X-Forwarded-For/Host/Server 는 넣지 않는다(FastAPI 는 쓰지 않음, 3.12). X-Forwarded-Proto 는 cloudflared 가 보낸 값이 그대로 간다.
ProxyAddHeaders Off
# 외부 이미지 저장(가이드)은 한 장에 15초까지 걸려 오래 걸릴 수 있다.
ProxyTimeout 600

ProxyPass "/assets/" "!"
ProxyPass "/assets" "!"
ProxyPass "/realtime-ws" "!"
ProxyPass "/relay-viewer" "!"
# api 의 tunnel 망 고정 주소(docker-compose.yml). 이 망에서 보내야 FastAPI 가 web 주소(10.250.88.2)로 본다.
ProxyPass "/" "http://10.250.88.3:8000/"
ProxyPassReverse "/" "http://10.250.88.3:8000/"
