# 파일 위치: docker/relay/supervisord.conf
# 역할: 중계 컨테이너에서 uvncrepeater, websockify, nginx 를 함께 기동
[program:uvncrepeater]
command=/usr/local/bin/uvncrepeater-ac /etc/uvncrepeater-ac.ini
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --verbose 127.0.0.1:6080 127.0.0.1:5900
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
