# 파일 위치: docker/relay/nginx.conf
# 역할: 중계 컨테이너용 nginx 최상위 설정 (stream 모듈 로드 + http/stream 설정 include)
user www-data;
worker_processes auto;
pid /run/nginx.pid;

load_module modules/ngx_stream_module.so;

events {
    worker_connections 2048;
}

# 런처 TLS 터널 (http 블록 밖에서 include)
include /etc/nginx/conf.d-stream/stream.conf;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
