# 파일 위치: docker-compose.yml
# 역할: RemoteHelp 개발 환경(포털, DB, 중계 서버, 검증용 고객 PC, Cloudflare Tunnel) 구성
# 포털(FastAPI, api) 환경변수. 서명 키처럼 여러 곳이 같은 값을 봐야 하는 것을 한 곳에 둔다.
# 비어 있는 값은 앱의 기본값을 쓴다(config.env() 는 빈 값을 없는 값으로 본다).
# 한쪽에만 넣으면 서명 토큰(CHAT_RESUME_SECRET 등)이 서로 어긋난다.
x-portal-env: &portal-env
  APP_NAME: ${APP_NAME:-RemoteHelp}
  # 비워 두면 포털이 접속한 주소를 그대로 쓴다(내부망 IP 로도 접속 가능).
  APP_BASE_URL: ${APP_BASE_URL:-}
  # 고객에게 보내는 접속 주소의 기준(예: https://help.wani.im/). 비우면 접속한 주소.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  APP_ENV: development
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-remotehelp}
  DB_USER: ${DB_USER:-remotehelp}
  DB_PASS: ${DB_PASS:-remotehelp}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  REALTIME_WS_URL: ${REALTIME_WS_URL:-}
  REALTIME_PUBLIC_PORT: ${REALTIME_PUBLIC_PORT:-8091}
  REALTIME_PUBLISH_URL: ${REALTIME_PUBLISH_URL:-http://realtime-msg:8091/publish}
  REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET:-change-me-realtime-secret}
  REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:-dev-realtime-token-secret}
  RELAY_AGENT_WS_URL: ${RELAY_AGENT_WS_URL:-wss://localhost:8443/agent}
  # auto: 접속한 포털 주소 기준으로 ws(s)://<호스트>/relay-viewer 를 쓴다(포털 경유).
  RELAY_VIEWER_WS_URL: ${RELAY_VIEWER_WS_URL:-wss://localhost:8443/viewer}
  RELAY_AUTH_SHARED_SECRET: ${RELAY_AUTH_SHARED_SECRET:-change-me-relay-secret}
  STORE_PRODUCT_ID: ${STORE_PRODUCT_ID:-0000000000000000}
  DIRECT_DOWNLOAD_ENABLED: ${DIRECT_DOWNLOAD_ENABLED:-false}
  LAUNCHER_MIN_VERSION: ${LAUNCHER_MIN_VERSION:-1.0.0}
  DEMO_ORG: ${DEMO_ORG:-}
  LANDING_WIDGET_ORG: ${LANDING_WIDGET_ORG:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  CONTACT_PHONE: ${CONTACT_PHONE:-}
  CHAT_RESUME_SECRET: ${CHAT_RESUME_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_CRYPTO: ${SMTP_CRYPTO:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: mysql:8.0
    container_name: remotehelp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-remotehelp}
      MYSQL_USER: ${DB_USER:-remotehelp}
      MYSQL_PASSWORD: ${DB_PASS:-remotehelp}
      TZ: UTC
    # 시간은 UTC 로 저장한다. 표시 변환은 애플리케이션이 조직 타임존으로 수행한다.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASS:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: remotehelp-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # 정적 파일만 내준다. 업로드는 api 가 쓰고 web 은 읽기만 한다.
      - ./backend/assets:/var/www/html/assets:ro
      # relay 공개 인증서(뷰어 웹소켓 포털 경유 시 검증용). 개인 키는 포함하지 않는다.
      - relay-ca:/etc/remotehelp/relay-ca:ro
    ports:
      - "8099:80"
    networks:
      default:
      # FastAPI 는 이 주소에서 온 X-RemoteHelp-Client-IP 만 믿는다(backend/app/core/request.py TRUSTED_PROXY_IP).
      tunnel:
        ipv4_address: 10.250.88.2

  # FastAPI 포털. 외부 경로(cloudflared, 8099, relay, realtime-msg)는 web(Apache)을 보고 Apache 가 여기로 넘긴다.
  # 8098 은 개발 중 직접 접속용이다(고객 IP 는 게이트웨이 주소로 보인다).
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: remotehelp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 개발 중에는 코드를 고치면 다시 읽는다. 운영은 Dockerfile 의 CMD 를 쓴다.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--no-proxy-headers", "--no-server-header", "--reload", "--reload-dir", "/app/app"]
    environment:
      <<: *portal-env
      ASSETS_DIR: /srv/assets
    volumes:
      - ./backend/app:/app/app
      # JS, CSS, 사전(템플릿이 읽음), 업로드. 업로드는 www-data(uid 33)가 쓴다.
      - ./backend/assets:/srv/assets
    ports:
      - "8098:8000"
    networks:
      default:
      # Apache(web)가 이 주소로 넘긴다(docker/web/backend-fastapi.conf). 같은 망이라 FastAPI 는 web 주소를 그대로 본다.
      tunnel:
        ipv4_address: 10.250.88.3

  relay:
    build:
      context: .
      dockerfile: docker/relay/Dockerfile
    container_name: remotehelp-relay
    restart: unless-stopped
    depends_on:
      - web
    environment:
      RELAY_SERVER_NAME: ${RELAY_SERVER_NAME:-localhost}
      RELAY_HTTPS_PORT: "8443"
      RELAY_UPSTREAM: "127.0.0.1:8081"
      RELAY_PORT: "8081"
      RELAY_HOST: "127.0.0.1"
      PORTAL_ORIGIN: http://web
      RELAY_AUTH_SHARED_SECRET: ${RELAY_AUTH_SHARED_SECRET:-change-me-relay-secret}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
    volumes:
      - relay-certs:/etc/remotehelp/certs
      - relay-ca:/etc/remotehelp/relay-ca
    ports:
      - "8443:8443"

  # 상담 실시간 메시지 서버. 메시지 저장은 포털이 하고 이 서버는 전달만 한다.
  realtime-msg:
    build:
      context: .
      dockerfile: docker/realtime/Dockerfile
    container_name: remotehelp-realtime
    restart: unless-stopped
    depends_on:
      - web
    environment:
      REALTIME_PORT: "8091"
      REALTIME_HOST: "0.0.0.0"
      PORTAL_ORIGIN: http://web
      REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET:-change-me-realtime-secret}
      REALTIME_LOG_LEVEL: ${REALTIME_LOG_LEVEL:-info}
    ports:
      - "8091:8091"

  # Cloudflare Tunnel. https://help.wani.im 요청을 web 으로 넘기고 고객 IP 를 CF-Connecting-IP 로 전달한다.
  # Docker Desktop 은 포트로 들어온 연결의 원래 IP 를 지우므로(모두 게이트웨이 IP 로 보임) 고객 IP 는 이 경로로만 알 수 있다.
  # 토큰이 있을 때만 켠다: .env 에 CLOUDFLARE_TUNNEL_TOKEN 과 COMPOSE_PROFILES=tunnel
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: remotehelp-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - web
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # web 의 mod_remoteip 는 이 주소에서 온 요청의 CF-Connecting-IP 만 믿는다(apache-vhost.conf 와 같아야 함).
    networks:
      tunnel:
        ipv4_address: 10.250.88.5

  # 검증용 고객 PC 에이전트 모의 컨테이너. 기본 기동하지 않고 profile 로 실행한다.
  #   docker compose --profile test run --rm -e AGENT_TOKEN=... agentsim
  agentsim:
    build:
      context: .
      dockerfile: docker/agentsim/Dockerfile
    profiles: ["test"]
    depends_on:
      - relay
    environment:
      RELAY_URL: ${AGENT_RELAY_URL:-wss://relay:8443/agent}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"

networks:
  # cloudflared 와 web 만 붙는 망. cloudflared 주소를 고정해 web 이 그 주소 하나만 프록시로 믿게 한다.
  # 주의: Docker Desktop 은 8099 로 직접 들어온 요청을 이 망의 게이트웨이(10.250.88.1)에서 온 것처럼 넘길 수 있다.
  # 그래서 대역 전체가 아니라 cloudflared 주소 하나만 믿어야 CF-Connecting-IP 위조를 막을 수 있다.
  tunnel:
    ipam:
      config:
        - subnet: 10.250.88.0/29

volumes:
  db-data:
  relay-certs:
  relay-ca:
